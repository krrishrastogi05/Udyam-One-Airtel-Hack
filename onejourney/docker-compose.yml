services:
  ollama:
    image: ollama/ollama:latest
    ports:
      - "127.0.0.1:11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    restart: unless-stopped

  app:
    build: .
    depends_on:
      - ollama
    environment:
      OLLAMA_BASE_URL: http://ollama:11434
      OLLAMA_MODEL: qwen3:8b
      ONEJOURNEY_DB: /data/onejourney.sqlite3
      ONEJOURNEY_PARTNER_KEY: ${ONEJOURNEY_PARTNER_KEY:-}
      ONEJOURNEY_OPS_KEY: ${ONEJOURNEY_OPS_KEY:-}
      ONEJOURNEY_DEMO_MODE: ${ONEJOURNEY_DEMO_MODE:-0}
      ONEJOURNEY_FIXTURE_DATE: ${ONEJOURNEY_FIXTURE_DATE:-2026-07-15}
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - journey_data:/data
    restart: unless-stopped

volumes:
  ollama_data:
  journey_data:
